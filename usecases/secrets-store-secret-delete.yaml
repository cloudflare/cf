description: "Delete a Secrets Store secret"
command: "wrangler secrets-store secret delete <store-id> --secret-id <secret-id> --remote"
status: "direct"
sourceCommands:
  - "wrangler secrets-store secret delete <store-id> --secret-id <secret-id> --remote"
cfReplacementFlow:
  - "cf secrets-store secrets delete <secret-id> --store-id <store-id> --force"
notes:
  - "Use cf --force for non-interactive deletion."
