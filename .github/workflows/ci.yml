name: CI

# Four jobs on every PR, merge-queue candidate, and push to main:
#
#   check — `pnpm check` (generation, dependency builds, lint/format + tsgo) over
#           the whole repo.
#   cli   — the cf CLI's in-package vitest suite (packages/cli).
#   cli-delegates — Node delegate subprocess tests on Windows and macOS.
#   wrangler-tests — the canonical Wrangler compatibility corpus retargeted
#                    at cf (packages/wrangler-tests).

on:
  pull_request:
  merge_group:
    types: [checks_requested]
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: ${{ github.repository_owner == 'cloudflare' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Test automation scripts
        run: node --test scripts/update-forge.test.ts

      - name: Lint, type-check, and format-check
        run: pnpm check

  cli:
    if: ${{ github.repository_owner == 'cloudflare' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Run cli tests
        run: pnpm --filter cf test

  cli-delegates:
    if: ${{ github.repository_owner == 'cloudflare' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          turbo-api: ${{ secrets.TURBO_API }}
          turbo-team: ${{ secrets.TURBO_TEAM }}
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-signature: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

      - name: Run delegate subprocess tests
        working-directory: packages/cli
        run: pnpm test src/__tests__/commands/dev/spawn.test.ts

  wrangler-tests:
    if: ${{ github.repository_owner == 'cloudflare' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Run Wrangler compatibility tests
        run: pnpm --filter @cloudflare/wrangler-tests test
