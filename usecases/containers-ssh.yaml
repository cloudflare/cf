description: "SSH into a running container instance"
command: "cf containers ssh <instance-id>"
status: "direct"
sourceCommands:
  - "wrangler containers ssh <instance-id>"
cfReplacementFlow:
  - "cf containers ssh <instance-id>"
  - "cf containers ssh <instance-id> --stdio"
notes:
  - "Both CLIs use containers-shared for OpenSSH and WebSocket stdin/stdout forwarding."
  - "SSH does not wake containers or count as activity to keep them alive."
  - "Pass remote command flags after -- to avoid parsing them as cf options."
