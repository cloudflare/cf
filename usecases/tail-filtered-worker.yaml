description: "Stream Worker logs with method/status/header/IP/search filters"
command: "wrangler tail <worker> --status error --search <term>"
status: "gap"
sourceCommands:
  - "wrangler tail --status <ok|error|canceled>"
  - "wrangler tail --method <method>"
  - "wrangler tail --header <header>"
  - "wrangler tail --search <term>"
  - "wrangler tail --ip <ip>"
  - "wrangler tail --sampling-rate <rate>"
cfReplacementFlow:
  - "No direct cf replacement."
notes:
  - "Worker tail-session operations are SDK-only; cf has neither descriptor CRUD commands nor the live stream consumer/filter UX."
