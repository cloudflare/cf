description: "List secrets in a Secrets Store store"
command: "wrangler secrets-store secret list <store-id> --remote"
status: "direct"
sourceCommands:
  - "wrangler secrets-store secret list <store-id> --remote"
cfReplacementFlow:
  - "cf secrets-store secrets list --store-id <store-id>"
notes:
  - "Wrangler local mode is not replaced by cf."
