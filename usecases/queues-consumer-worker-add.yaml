description: "Attach a Worker consumer to a Queue"
command: "wrangler queues consumer worker add <queue> <worker>"
status: "partial"
sourceCommands:
  - "wrangler queues consumer add <queue> <worker>"
  - "wrangler queues consumer worker add <queue> <worker>"
cfReplacementFlow:
  - "cf queues consumers create --queue-id <queue-id> --type worker --script-name <worker> --body @consumer-settings.json"
notes:
  - "Wrangler exposes batch/retry/dead-letter/max-concurrency flags. cf may require lower-level body fields and IDs."
