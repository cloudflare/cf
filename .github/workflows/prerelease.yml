name: Prerelease

# Publish per-commit, per-PR prerelease packages via pkg-pr-new. Anyone can
# install the build for a specific PR/commit with:
#
#   pnpm i https://pkg.pr.new/cloudflare/cf/cf@<sha>
#
# Modeled after the wsdk equivalent at .github/workflows/prerelease.yml.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  # pkg-pr-new uses GitHub OIDC to associate releases with the workflow run.
  id-token: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: ${{ github.repository_owner == 'cloudflare' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production
          GITHUB_TOKEN: ${{ secrets.FORGE_GH_ACCESS_TOKEN }}
          # Baked into the binary at build time via Pack's `define` —
          # see packages/cli/vite.config.ts.
          PACKAGE_PRERELEASE_LABEL: ${{ github.head_ref || github.ref_name }}
          SPARROW_SOURCE_KEY: ${{ secrets.SPARROW_SOURCE_KEY }}

      - name: Publish prerelease via pkg-pr-new
        run: pnpm dlx pkg-pr-new publish --pnpm --compact --no-template ./packages/cli
