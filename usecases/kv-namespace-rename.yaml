description: "Rename a Workers KV namespace"
command: "wrangler kv namespace rename <namespace> --new-name <new-name>"
status: "partial"
sourceCommands:
  - "wrangler kv namespace rename <namespace> --new-name <new-name>"
cfReplacementFlow:
