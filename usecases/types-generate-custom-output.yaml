description: "Generate Worker types to a custom file or interface name"
command: "wrangler types ./src/env.d.ts --env-interface Env"
status: "partial"
sourceCommands:
  - "wrangler types <path> --env-interface <name>"
  - "wrangler types --include-runtime false"
  - "wrangler types --include-env false"
  - "wrangler types --strict-vars"
cfReplacementFlow:
  - "cf workers types --include-runtime=false"
notes:
  - "cf supports the runtime toggle but always reads cloudflare.config.ts and writes .cloudflare/types/index.d.ts."
  - "Custom output paths, interface names, --include-env, and --strict-vars are not supported."
