description: "List keys in a Workers KV namespace"
command: "wrangler kv key list --namespace-id <id>"
status: "partial"
sourceCommands:
  - "wrangler kv key list"
cfReplacementFlow:
  - "cf kv keys list --namespace-id <namespace-id>"
  - "cf kv keys list --namespace-id <namespace-id> --prefix <prefix>"
notes:
  - "Wrangler supports binding/local/preview flags. cf does not read Worker config to resolve them."
