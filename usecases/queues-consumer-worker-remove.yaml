description: "Remove a Worker consumer from a Queue"
command: "wrangler queues consumer worker remove <queue> <worker>"
status: "partial"
sourceCommands:
  - "wrangler queues consumer remove <queue> <worker>"
  - "wrangler queues consumer worker remove <queue> <worker>"
cfReplacementFlow:
