packages:
  - packages/*
  - fixtures/*

patchedDependencies:
  "@changesets/cli@2.31.0": patches/@changesets__cli@2.31.0.patch
  "@cloudflare/containers-shared@*": patches/@cloudflare__containers-shared@0.23.9.patch
  "@cloudflare/deploy-helpers@*": patches/@cloudflare__deploy-helpers@0.20.1.patch
  "@cloudflare/workers-utils@0.52.0": patches/@cloudflare__workers-utils@0.52.0.patch
  miniflare@5.20261104.0-beta: patches/miniflare@5.20261104.0-beta.patch

# Prevent transitive deps from pulling from git / tarball URLs.
# Direct deps (the pinned pkg.pr.new Forge build) are allowed.
blockExoticSubdeps: true

# Allow Cloudflare release batches before pnpm's maturity cutoff. Keep these
# exclusions independent of the current package versions so Dependabot can
# install a newly published batch without editing this list each time.
minimumReleaseAgeExclude:
  - "@cloudflare/*"
  - miniflare
  - workerd
  - wrangler

# pnpm blocks install scripts by default; allowlist what needs them.
allowBuilds:
  "@scarf/scarf": false
  esbuild: true
  msw: false
  # workerd's postinstall places the platform binary miniflare (`--local`)
  # execs. Nothing else in miniflare's tree has an install script.
  workerd: true

gitChecks: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
overrides:
  vite@*: "catalog:"
  vitest@*: 5.0.5
  "@cloudflare/workers-utils": "https://pkg.pr.new/cloudflare/workers-sdk/@cloudflare/workers-utils@b55be5a2bf5e9dc27ba2be20883e062e6b62abb6"
  "@cloudflare/containers-shared": "https://pkg.pr.new/cloudflare/workers-sdk/@cloudflare/containers-shared@b55be5a2bf5e9dc27ba2be20883e062e6b62abb6"
  "@cloudflare/deploy-helpers": "https://pkg.pr.new/cloudflare/workers-sdk/@cloudflare/deploy-helpers@b55be5a2bf5e9dc27ba2be20883e062e6b62abb6"
  "@cloudflare/workers-auth": "https://pkg.pr.new/cloudflare/workers-sdk/@cloudflare/workers-auth@b55be5a2bf5e9dc27ba2be20883e062e6b62abb6"
  "miniflare": "https://pkg.pr.new/cloudflare/workers-sdk/miniflare@b55be5a2bf5e9dc27ba2be20883e062e6b62abb6"
  "@cloudflare/build-output-utils": "0.9.10"
  "@cloudflare/config": "0.30.2"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
