packages:
  - packages/*
  - fixtures/*

patchedDependencies:
  "@changesets/cli@2.31.0": patches/@changesets__cli@2.31.0.patch
  "@cloudflare/containers-shared@*": patches/@cloudflare__containers-shared@0.21.1.patch
  "@cloudflare/deploy-helpers@*": patches/@cloudflare__deploy-helpers@0.19.0.patch

# Prevent transitive deps from pulling from git / tarball URLs.
# Direct deps (vendor/*.tgz) are still allowed.
blockExoticSubdeps: true

# Allow Cloudflare release batches before pnpm's maturity cutoff. Keep these
# exclusions independent of the current package versions so the updater can
# install a newly published batch without editing this list each time.
minimumReleaseAgeExclude:
  - "@cloudflare/autoconfig"
  - "@cloudflare/build-output-utils"
  - "@cloudflare/cli-shared-helpers"
  - "@cloudflare/codemods"
  - "@cloudflare/config"
  - "@cloudflare/containers-shared"
  - "@cloudflare/deploy-helpers"
  - "@cloudflare/runtime-types"
  - "@cloudflare/workerd-darwin-64"
  - "@cloudflare/workerd-darwin-arm64"
  - "@cloudflare/workerd-linux-64"
  - "@cloudflare/workerd-linux-arm64"
  - "@cloudflare/workerd-windows-64"
  - "@cloudflare/workers-auth"
  - "@cloudflare/workers-types"
  - "@cloudflare/workers-utils"
  - miniflare
  - workerd
  - wrangler

# pnpm blocks install scripts by default; allowlist what needs them.
allowBuilds:
  "@scarf/scarf": false
  esbuild: true
  msw: false
  # workerd's postinstall places the platform binary miniflare (`--local`)
  # execs. Nothing else in miniflare's tree has an install script.
  workerd: true

gitChecks: false
