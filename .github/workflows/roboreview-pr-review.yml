name: Roboreview (PR)

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: roboreview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip Version Packages PRs (auto-generated by the changesets action) since they don't need a Bonk review
    if: |
      github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name &&
      !(github.event.pull_request.base.repo.owner.login == 'cloudflare' && github.event.pull_request.head.ref == 'changeset-release/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 30
          persist-credentials: false

      - name: Load review prompt
        id: prompt
        run: |
          {
            echo 'value<<EOF'
            echo "You are reviewing PR #${{ github.event.pull_request.number }} on ${{ github.repository }}."
            echo ""
            cat .github/roboreview.md
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Run Roboreview
        uses: Cloudflare-Studio/ask-bonk/github@main
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_AI_GATEWAY_ACCOUNT_ID }}
          CLOUDFLARE_GATEWAY_ID: ${{ secrets.CF_AI_GATEWAY_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_AI_GATEWAY_TOKEN }}
          # Paths outside the checkout are denied, not prompted: nobody can answer a prompt in CI.
          OPENCODE_CONFIG_CONTENT: '{"permission":{"external_directory":{"*":"deny","/home/runner/work/**":"allow"},"edit":"deny","question":"deny","doom_loop":"deny"}}'
        with:
          # Stop Bonk before the job's timeout-minutes so it can report the outcome itself.
          timeout: "25m"
          oidc_base_url: https://ask-bonk.cloudflare-exponent.workers.dev/auth
          model: "cloudflare-ai-gateway/openai/gpt-5.6-terra"
          variant: "high"
          forks: "false"
          permissions: write
          token_permissions: NO_PUSH # the reviewer can comment but never push code
          # Temporary: the gateway-token fix is only in OpenCode's dev channel.
          # Swap back to a stable pin once it lands in a release.
          opencode_dev: true
          opencode_version: "latest"
          prompt: ${{ steps.prompt.outputs.value }}
