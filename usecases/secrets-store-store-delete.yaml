description: "Delete a Secrets Store store"
command: "wrangler secrets-store store delete <store-id> --remote"
status: "direct"
sourceCommands:
  - "wrangler secrets-store store delete <store-id> --remote"
cfReplacementFlow:
  - "cf secrets-store stores delete <store-id> --force"
notes:
  - "cf uses --force for destructive confirmation."
