packages:
  - packages/*
  - fixtures/*

patchedDependencies:
  "@changesets/cli@2.31.0": patches/@changesets__cli@2.31.0.patch

# Prevent transitive deps from pulling from git / tarball URLs.
# Direct deps are allowed.
blockExoticSubdeps: true

# Allow Cloudflare release batches before pnpm's maturity cutoff. Keep these
# exclusions independent of the current package versions so Dependabot can
# install a newly published batch without editing this list each time.
minimumReleaseAgeExclude:
  - "@cloudflare/*"
  - miniflare
  - workerd
  - wrangler

# pnpm blocks install scripts by default; allowlist what needs them.
allowBuilds:
  "@scarf/scarf": false
  esbuild: true
  msw: false
  # workerd's postinstall places the platform binary miniflare (`--local`)
  # execs. Nothing else in miniflare's tree has an install script.
  workerd: true

gitChecks: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
overrides:
  # The PR preview rewrites unchanged SDK siblings to URLs. Keep them on
  # cf's released versions while blockExoticSubdeps is enabled; remove these
  # overrides when switching deploy-helpers back to a registry release.
  "@cloudflare/deploy-helpers@0.30.0>@cloudflare/config": "1.0.0-rc.4"
  "@cloudflare/deploy-helpers@0.30.0>@cloudflare/containers-shared": "0.27.2"
  "@cloudflare/deploy-helpers@0.30.0>@cloudflare/workers-utils": "0.57.0"
  "@cloudflare/deploy-helpers@0.30.0>miniflare": "5.20261123.1-beta"
  vite@*: "catalog:"
  vitest@*: 5.1.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
