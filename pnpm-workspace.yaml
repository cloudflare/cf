packages:
  - packages/*
  - fixtures/*

patchedDependencies:
  "@changesets/cli@2.31.0": patches/@changesets__cli@2.31.0.patch
  "@cloudflare/containers-shared@0.21.1": patches/@cloudflare__containers-shared@0.21.1.patch
  "@cloudflare/deploy-helpers@0.19.0": patches/@cloudflare__deploy-helpers@0.19.0.patch

# Prevent transitive deps from pulling from git / tarball URLs.
# Direct deps (vendor/*.tgz) are still allowed.
blockExoticSubdeps: true

# pkg.pr.new rewrites workspace dependencies to preview URLs. This change only
# needs the autoconfig preview, so keep its unchanged dependencies on releases.
overrides:
  "@cloudflare/autoconfig>@cloudflare/config": "0.22.0"
  "@cloudflare/autoconfig>@cloudflare/workers-utils": "0.45.0"

# Allow newly published direct dependencies before pnpm's maturity cutoff.
minimumReleaseAgeExclude:
  - "@cloudflare/autoconfig@0.7.3"
  - "@cloudflare/build-output-utils@0.8.4"
  - "@cloudflare/cli-shared-helpers@0.2.1"
  - "@cloudflare/codemods@0.3.0"
  - "@cloudflare/config@0.22.0"
  - "@cloudflare/containers-shared@0.21.1"
  - "@cloudflare/deploy-helpers@0.19.0"
  - "@cloudflare/runtime-types@0.1.6"
  - "@cloudflare/workerd-darwin-64@1.20260930.2"
  - "@cloudflare/workerd-darwin-arm64@1.20260930.2"
  - "@cloudflare/workerd-linux-64@1.20260930.2"
  - "@cloudflare/workerd-linux-arm64@1.20260930.2"
  - "@cloudflare/workerd-windows-64@1.20260930.2"
  - "@cloudflare/workers-auth@0.11.0"
  - "@cloudflare/workers-types@5.20260930.2"
  - "@cloudflare/workers-utils@0.45.0"
  - miniflare@5.20260930.0-alpha
  - workerd@1.20260930.2
  - "wrangler@4.145.0"

# pnpm blocks install scripts by default; allowlist what needs them.
allowBuilds:
  "@scarf/scarf": false
  esbuild: true
  msw: false
  # workerd's postinstall places the platform binary miniflare (`--local`)
  # execs. Nothing else in miniflare's tree has an install script.
  workerd: true

gitChecks: false
