name: "Install Dependencies"
description: "Set up pnpm + Node and run pnpm install --frozen-lockfile."

inputs:
  # We run on Node.js 22 by default — matches `engines.node` in package.json.
  node-version:
    description: Node.js version to install.
    default: "22"
  working-directory:
    description: >-
      Workspace root containing pnpm-lock.yaml. Useful when the caller checks
      out into a subdirectory (e.g. for PR-vs-base comparisons).
    default: "."
  registry-url:
    description: >-
      npm registry URL to write into the runner's `.npmrc`. Required for npm
      trusted publishing (OIDC) — without it, `npm publish` doesn't know which
      registry to exchange the OIDC token against. Leave unset for non-release
      jobs.
    default: ""
  disable-cache:
    description: >-
      When "true", skip the pnpm store cache on setup-node. Defense in depth
      for release builds: avoids pulling artefacts from a potentially-poisoned
      cache and forces every dep to resolve from the registry.
    default: "false"

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
      with:
        # The action runs from $GITHUB_WORKSPACE; if the caller checks out
        # into a subdirectory (e.g. `head/`), `packageManager` lives there.
        package_json_file: ${{ inputs.working-directory }}/package.json

    # Two conditional setup-node steps: one with the pnpm store cache on
    # (the default, fast path for PR / CI builds) and one without (used by
    # release builds via `disable-cache: "true"`). `setup-node` doesn't
    # accept a runtime-toggle for the cache, so we split the step.
    - name: Install Node.js ${{ inputs.node-version }} (with pnpm cache)
      if: inputs.disable-cache != 'true'
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
        registry-url: ${{ inputs.registry-url }}

    - name: Install Node.js ${{ inputs.node-version }} (without pnpm cache)
      if: inputs.disable-cache == 'true'
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}

    # Effective for Node 22+. See
    # https://nodejs.org/docs/latest/api/module.html#module-compile-cache
    - name: Enable Node compile cache
      shell: bash
      run: echo "NODE_COMPILE_CACHE=$HOME/.node_compile_cache" >> $GITHUB_ENV

    - name: pnpm install (frozen lockfile)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile
