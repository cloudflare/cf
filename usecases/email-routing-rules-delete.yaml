description: "Delete an Email Routing rule"
command: "wrangler email routing rules delete <domain> <rule-id>"
status: "direct"
sourceCommands:
  - "wrangler email routing rules delete <domain> <rule-id>"
cfReplacementFlow:
  - "cf email-routing rules delete <rule-id> --zone <zone> --force"
notes:
  - "Use cf --force for non-interactive deletion."
