name: Update workers-sdk dependencies

on:
  repository_dispatch:
    types: [workers-sdk-published]
  workflow_dispatch:
    inputs:
      sha:
        description: The workers-sdk commit used for a completed npm publish
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-workers-sdk
  cancel-in-progress: false

jobs:
  update:
    if: ${{ github.repository_owner == 'cloudflare' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WORKERS_SDK_SHA: ${{ github.event.client_payload.sha || inputs.sha }}
      GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN || github.token }}
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout cf
        uses: actions/checkout@v6
        with:
          path: cf
          ref: main
          persist-credentials: false
          token: ${{ secrets.GH_ACCESS_TOKEN || github.token }}

      - name: Checkout the published workers-sdk commit
        uses: actions/checkout@v6
        with:
          repository: cloudflare/workers-sdk
          ref: ${{ env.WORKERS_SDK_SHA }}
          path: workers-sdk
          sparse-checkout: packages
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          package_json_file: cf/package.json

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: cf/pnpm-lock.yaml

      - name: Install cf dependencies
        run: pnpm install --frozen-lockfile
        working-directory: cf

      - name: Update the workers-sdk package versions
        id: update
        run: node scripts/update-workers-sdk.mjs ../workers-sdk
        working-directory: cf

      - name: Resolve the new lockfile
        if: ${{ steps.update.outputs.skip != 'true' }}
        run: pnpm install --no-frozen-lockfile
        working-directory: cf

      - name: Create or update the pull request
        if: ${{ steps.update.outputs.skip != 'true' }}
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          path: cf
          base: main
          branch: automation/update-workers-sdk
          commit-message: "chore: update workers-sdk dependencies"
          title: "chore: update workers-sdk dependencies"
          body: |
            Updates cf's workers-sdk packages from the completed
            [workers-sdk publish](https://github.com/cloudflare/workers-sdk/commit/${{ env.WORKERS_SDK_SHA }}).

            This PR is maintained by the Update workers-sdk dependencies workflow.
            The two pnpm patches must still apply to the new package versions.
          add-paths: |
            packages/*/package.json
            fixtures/*/package.json
            pnpm-lock.yaml
            .changeset/update-workers-sdk.md
            .github/workers-sdk-release.json
