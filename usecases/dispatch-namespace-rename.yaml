description: "Rename a dispatch namespace"
command: "wrangler dispatch-namespace rename <old-name> <new-name>"
status: "partial"
sourceCommands:
  - "wrangler dispatch-namespace rename <old-name> <new-name>"
cfReplacementFlow:
  - "cf workers-for-platforms dispatch-namespaces edit <old-name> --name <new-name>"
  - "cf workers-for-platforms dispatch-namespaces edit <old-name> --body @rename.json"
notes:
  - "cf exposes the PATCH operation as edit rather than a rename alias."
