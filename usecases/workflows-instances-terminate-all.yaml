description: "Terminate all Workflow instances or all instances matching a status"
command: "wrangler workflows instances terminate-all <workflow>"
status: "partial"
sourceCommands:
  - "wrangler workflows instances terminate-all <workflow>"
cfReplacementFlow:
  - "cf workflows instances batch-terminate --workflow-name <workflow> --body @terminate-all.json --force"
  - "cf workflows instances status-terminate --workflow-name <workflow> --body @status-terminate.json --force"
notes:
  - "Wrangler command is hidden and friendly; cf exposes lower-level batch/status terminate endpoints if generated."
