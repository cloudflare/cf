name: CI

# Three jobs on every PR, merge-queue candidate, and push to main:
#
#   check — `pnpm check` (oxlint --type-aware + tsgo + oxfmt --check) over
#           the whole repo.
#   cli   — the cf CLI's in-package vitest suite (packages/cli).
#   wrangler-tests — the canonical Wrangler compatibility corpus retargeted
#                    at cf (packages/wrangler-tests).

on:
  pull_request:
  merge_group:
    types: [checks_requested]
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: ${{ github.repository_owner == 'cloudflare' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          turbo-api: ${{ secrets.TURBO_API }}
          turbo-team: ${{ secrets.TURBO_TEAM }}
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-signature: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

      # check:lint / check:type depend on `generate` via turbo; run it
      # explicitly first so check:format (which has no such dependency)
      # also sees the generated tree. Cache-hit no-op when warm.
      - name: Generate command surface
        run: pnpm generate

      - name: Lint, type-check, and format-check
        run: pnpm check

  cli:
    if: ${{ github.repository_owner == 'cloudflare' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          turbo-api: ${{ secrets.TURBO_API }}
          turbo-team: ${{ secrets.TURBO_TEAM }}
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-signature: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

      # The cli tests run against source, which imports
      # src/commands/_generated/ (gitignored). Generate it first; turbo
      # remote cache (configured above) makes this a no-op on cache hits.
      - name: Generate command surface
        run: pnpm generate

      - name: Run cli tests
        run: pnpm --filter cf test

  wrangler-tests:
    if: ${{ github.repository_owner == 'cloudflare' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          turbo-api: ${{ secrets.TURBO_API }}
          turbo-team: ${{ secrets.TURBO_TEAM }}
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-signature: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

      - name: Generate command surface
        run: pnpm generate

      - name: Run Wrangler compatibility tests
        run: pnpm --filter @cloudflare/wrangler-tests test
