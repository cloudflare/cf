packages:
  - packages/*
  - fixtures/*

patchedDependencies:
  "@changesets/cli@2.31.0": patches/@changesets__cli@2.31.0.patch

# Prevent transitive deps from pulling from git / tarball URLs.
# Direct deps are allowed.
# Temporarily off: the workers-sdk autoconfig preview below depends on the
# cli-shared-helpers preview by URL. Turn back on with the released versions.
blockExoticSubdeps: false

# Allow Cloudflare release batches before pnpm's maturity cutoff. Keep these
# exclusions independent of the current package versions so Dependabot can
# install a newly published batch without editing this list each time.
minimumReleaseAgeExclude:
  - "@cloudflare/*"
  - miniflare
  - workerd
  - wrangler

# pnpm blocks install scripts by default; allowlist what needs them.
allowBuilds:
  "@scarf/scarf": false
  esbuild: true
  msw: false
  # workerd's postinstall places the platform binary miniflare (`--local`)
  # execs. Nothing else in miniflare's tree has an install script.
  workerd: true

gitChecks: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
overrides:
  vite@*: "catalog:"
  vitest@*: 5.1.0
  # The workers-sdk autoconfig preview (cloudflare/workers-sdk#17238) links its
  # workspace dependencies to previews; keep the ones cf already pins.
  "@cloudflare/autoconfig>@cloudflare/config": 1.0.0-rc.5
  "@cloudflare/autoconfig>@cloudflare/workers-utils": 0.58.0
  # One copy, so log levels set by cf also apply to the packages that log through it.
  "@cloudflare/cli-shared-helpers": https://pkg.pr.new/cloudflare/workers-sdk/@cloudflare/cli-shared-helpers@098e110
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
