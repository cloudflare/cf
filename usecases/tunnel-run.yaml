description: "Run a named or token-based tunnel with cloudflared"
command: "wrangler tunnel run <tunnel>"
status: "direct"
sourceCommands:
  - "wrangler tunnel run <tunnel>"
  - "wrangler tunnel run --token <token>"
cfReplacementFlow:
  - "cf tunnels run <tunnel>"
  - "cf tunnels run --token <token>"
notes:
  - "cf downloads and manages the cloudflared binary."
