description: "Add one R2 lifecycle rule while preserving existing rules"
command: "wrangler r2 bucket lifecycle add <bucket> [name] [prefix]"
status: "partial"
sourceCommands:
  - "wrangler r2 bucket lifecycle add <bucket> [name] [prefix]"
cfReplacementFlow:
  - "cf r2 buckets lifecycle get <bucket>"
  - "Edit lifecycle JSON locally to append the rule."
  - "cf r2 buckets lifecycle update <bucket> --body @lifecycle.json"
notes:
  - "Wrangler provides an add-rule compound read/modify/write helper with prompts. cf exposes the underlying config document."
