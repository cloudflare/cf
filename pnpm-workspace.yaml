packages:
  - packages/*
  - fixtures/*

patchedDependencies:
  "@changesets/cli@2.31.0": patches/@changesets__cli@2.31.0.patch

# Prevent transitive deps from pulling from git / tarball URLs.
# Direct deps (the pinned pkg.pr.new Forge and autoconfig builds) are allowed.
blockExoticSubdeps: true

# Allow Cloudflare release batches before pnpm's maturity cutoff. Keep these
# exclusions independent of the current package versions so Dependabot can
# install a newly published batch without editing this list each time.
minimumReleaseAgeExclude:
  - "@cloudflare/*"
  - miniflare
  - workerd
  - wrangler

# pnpm blocks install scripts by default; allowlist what needs them.
allowBuilds:
  "@scarf/scarf": false
  esbuild: true
  msw: false
  # workerd's postinstall places the platform binary miniflare (`--local`)
  # execs. Nothing else in miniflare's tree has an install script.
  workerd: true

gitChecks: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
overrides:
  # The autoconfig PR preview rewrites unchanged workspace deps to preview URLs.
  "@cloudflare/autoconfig>@cloudflare/config": "1.0.0-rc.2"
  "@cloudflare/autoconfig>@cloudflare/workers-utils": "0.55.0"
  vite@*: "catalog:"
  vitest@*: 5.1.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
