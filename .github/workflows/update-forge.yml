name: Update Forge

# GitHub Actions cannot subscribe to releases or packages in another
# repository. Poll hourly by default;
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [forge-release-published]

permissions:
  contents: write
  pull-requests: write
  packages: read

concurrency:
  group: update-forge
  cancel-in-progress: false

env:
  UPDATE_BRANCH: automation/update-forge
  BASE_BRANCH: main

jobs:
  update:
    name: Update Forge and OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The PAT makes PR creation and later branch updates emit the usual PR
      # workflow events. github.token remains a useful fallback for forks.
      GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN || github.token }}
    steps:
      - name: Checkout cf
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: main
          token: ${{ secrets.GH_ACCESS_TOKEN || github.token }}

      - name: Set up Vite+, Node.js, and pnpm
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: "22"
          run-install: true

      - name: Update Forge and OpenAPI
        run: node scripts/update-forge.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ACCESS_TOKEN || github.token }}
          # Access to GitHub packages can be granted on classic access tokens or directly to
          # the GitHub Actions token. Two avoid using a second classic token, we use the GitHub Actions token here.
          FORGE_PACKAGE_TOKEN: ${{ github.token }}
