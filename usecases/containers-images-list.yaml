description: "List images in Cloudflare managed registry"
command: "wrangler containers images list"
status: "direct"
sourceCommands:
  - "wrangler containers images list"
cfReplacementFlow:
  - "cf containers images list"
notes:
  - "Uses the same managed-registry image operations as Wrangler through @cloudflare/containers-shared."
  - "Lists all catalog pages using pull-only credentials; outputs repository names and tags as JSON and supports --filter."
