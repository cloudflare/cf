description: "Disable R2 Data Catalog compaction"
command: "wrangler r2 bucket catalog compaction disable <bucket> [namespace] [table]"
status: "partial"
sourceCommands:
  - "wrangler r2 bucket catalog compaction disable <bucket>"
cfReplacementFlow:
  - "cf r2-data-catalog maintenance-configs update <bucket> --body @maintenance.json"
  - "cf r2-data-catalog namespaces tables maintenance-configs update <table> --namespace <namespace> --body @maintenance.json"
notes:
  - "Set the compaction settings disabled in the maintenance config body."
