description: "Disable R2 Data Catalog snapshot expiration"
command: "wrangler r2 bucket catalog snapshot-expiration disable <bucket> [namespace] [table]"
status: "partial"
sourceCommands:
  - "wrangler r2 bucket catalog snapshot-expiration disable <bucket>"
cfReplacementFlow:
  - "cf r2-data-catalog maintenance-configs update <bucket> --body @maintenance.json"
  - "cf r2-data-catalog namespaces tables maintenance-configs update <table> --namespace <namespace> --body @maintenance.json"
notes:
  - "This is a lower-level maintenance-config mutation in cf."
