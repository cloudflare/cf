name: Renovate

on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:
  pull_request:
    types: [edited]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    if: |
      github.repository_owner == 'cloudflare' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.user.login == 'ant-release-bot')
    name: Dependency updates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Renovate has write credentials; always run trusted repository code.
          ref: main
          persist-credentials: false

      - name: Run Renovate
        uses: renovatebot/github-action@230ce922b08968d0a4f6f70f295601daff09ef1d # v46.3.7
        with:
          configurationFile: .github/renovate-global.json
          renovate-image: ghcr.io/renovatebot/renovate@sha256:cada8681f79e153506daf4e89e5fc405efb281a7d8f9d9fc5e3eb54d5b74bc85 # 44.135.0
          token: ${{ secrets.GH_ACCESS_TOKEN }}
