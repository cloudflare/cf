description: "Create an AI Search instance"
command: "wrangler ai-search create <name>"
status: "partial"
sourceCommands:
  - "wrangler ai-search create <name> --type builtin"
  - "wrangler ai-search create <name> --type r2 --source <bucket>"
  - "wrangler ai-search create <name> --type web-crawler --source <url>"
cfReplacementFlow:
  - "cf ai-search create --body @ai-search.json"
notes:
  - "Wrangler has an interactive/source-specific wizard and many friendly model/chunk/reranking flags. cf likely expects API-shaped fields or less ergonomic generated flags."
