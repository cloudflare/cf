description: "Enable R2 Data Catalog compaction at catalog or table level"
command: "wrangler r2 bucket catalog compaction enable <bucket> [namespace] [table]"
status: "partial"
sourceCommands:
  - "wrangler r2 bucket catalog compaction enable <bucket>"
cfReplacementFlow:
  - "cf r2-data-catalog maintenance-configs update <bucket> --body @maintenance.json"
  - "cf r2-data-catalog namespaces tables maintenance-configs update <table> --namespace <namespace> --body @maintenance.json"
notes:
  - "Wrangler wraps credential setup and catalog-vs-table branching. cf exposes lower-level maintenance config APIs."
