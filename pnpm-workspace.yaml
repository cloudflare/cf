packages:
  - packages/*
  - fixtures/*

patchedDependencies:
  "@changesets/cli@2.31.0": patches/@changesets__cli@2.31.0.patch
  "@cloudflare/containers-shared@*": patches/@cloudflare__containers-shared@0.21.1.patch
  "@cloudflare/deploy-helpers@*": patches/@cloudflare__deploy-helpers@0.20.1.patch

# Prevent transitive deps from pulling from git / tarball URLs.
# Direct deps (the pinned pkg.pr.new builds) are still allowed.
blockExoticSubdeps: true

# Allow Cloudflare release batches before pnpm's maturity cutoff. Keep these
# exclusions independent of the current package versions so Dependabot can
# install a newly published batch without editing this list each time.
minimumReleaseAgeExclude:
  - "@cloudflare/*"
  - miniflare
  - workerd
  - wrangler

# pnpm blocks install scripts by default; allowlist what needs them.
allowBuilds:
  "@scarf/scarf": false
  esbuild: true
  msw: false
  # workerd's postinstall places the platform binary miniflare (`--local`)
  # execs. Nothing else in miniflare's tree has an install script.
  workerd: true

gitChecks: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
overrides:
  # Keep the secrets-file prerelease on cf's existing dependencies until its npm release.
  "@cloudflare/deploy-helpers>@cloudflare/config": "0.28.0"
  "@cloudflare/deploy-helpers>@cloudflare/containers-shared": "0.23.2"
  "@cloudflare/workers-utils": "file:vendor/cloudflare-workers-utils-9d444f329a999e8fff31eed2c27a4719506a39c5.tgz"
  "@cloudflare/deploy-helpers>miniflare": "5.20261019.2-beta"
  vite@*: "catalog:"
  vitest@*: 5.0.5
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
