description: "List R2 bucket event notification rules"
command: "wrangler r2 bucket notification list <bucket>"
status: "direct"
sourceCommands:
  - "wrangler r2 bucket notification list <bucket>"
  - "wrangler r2 bucket notification get <bucket>"
cfReplacementFlow:
  - "cf r2 buckets event-notifications list <bucket>"
notes:
  - "Wrangler notification get is an alias for list."
