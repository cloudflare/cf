description: "Show top-level or command-specific CLI help"
command: "wrangler <command> --help"
status: "direct"
sourceCommands:
  - "wrangler --help"
  - "wrangler <command> --help"
cfReplacementFlow:
  - "cf --help"
  - "cf <command> --help"
notes:
  - "Global flags differ between the CLIs. Wrangler project flags like --config, --cwd, and --env are not cf globals today."
