description: "Attach a custom domain to an R2 bucket"
command: "wrangler r2 bucket domain add <bucket> --domain <domain> --zone-id <zone-id>"
status: "partial"
sourceCommands:
  - "wrangler r2 bucket domain add <bucket> --domain <domain> --zone-id <zone-id>"
cfReplacementFlow:
  - "cf r2 buckets domains custom create <bucket> --domain <domain> --body @custom-domain.json"
notes:
  - "Wrangler has a friendly zone-id/min-tls flag surface. cf uses the generated API schema."
