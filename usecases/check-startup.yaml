description: "Profile Worker startup performance and emit startup diagnostics"
command: "wrangler check startup"
status: "partial"
sourceCommands:
  - "wrangler check startup"
cfReplacementFlow:
  - "cf workers check [--outfile <path>] [--prebuilt]"
notes:
  - "cf flattens Wrangler's check startup path to workers check."
  - "By default cf runs its standard build flow; --prebuilt profiles existing Build Output Specification files instead."
  - "Wrangler's --args, --worker-bundle, and Pages-specific paths are not carried over."
