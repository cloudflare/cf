description: "Enable R2 Data Catalog snapshot expiration"
command: "wrangler r2 bucket catalog snapshot-expiration enable <bucket> [namespace] [table]"
status: "partial"
sourceCommands:
  - "wrangler r2 bucket catalog snapshot-expiration enable <bucket>"
cfReplacementFlow:
  - "cf r2-data-catalog maintenance-configs update <bucket> --body @maintenance.json"
  - "cf r2-data-catalog namespaces tables maintenance-configs update <table> --namespace <namespace> --body @maintenance.json"
notes:
  - "Wrangler's --older-than-days and --retain-last flags become JSON fields in cf."
