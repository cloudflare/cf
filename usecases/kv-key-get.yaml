description: "Read one Workers KV key value"
command: "wrangler kv key get <key> --namespace-id <id>"
status: "partial"
sourceCommands:
  - "wrangler kv key get <key>"
cfReplacementFlow:
  - "cf kv keys get <key> --namespace-id <namespace-id>"
  - "cf kv keys get <key> --namespace-id <namespace-id> --text"
notes:
