description: "Delete a certificate by ID or name"
command: "wrangler cert delete --id <id>"
status: "partial"
sourceCommands:
  - "wrangler cert delete --id <id>"
  - "wrangler cert delete --name <name>"
cfReplacementFlow:
  - "cf mtls-certificates delete <id> --force"
  - "For name deletion: cf mtls-certificates list, resolve ID, then delete."
notes:
  - "Wrangler resolves --name. cf generated delete is typically ID-oriented."
