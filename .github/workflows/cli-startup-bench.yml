name: CLI startup benchmark

# Track `cf --help` startup time over time. On PRs, build both the PR head
# and the base ref, run hyperfine against each, and post a sticky comment
# with the delta. On pushes to main, just record the absolute number in the
# job summary so we have a baseline over time.
#
# This is *visibility*, not a gate — the job never fails on regression. Use
# it to spot trends; investigate on signal, ignore single-PR jitter.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # Needed so the sticky-comment step can post on PRs from same-repo branches.
  # Fork PRs run with read-only token and will skip the comment (the job
  # summary still has the numbers).
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-bench
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bench:
    name: Measure cf --help startup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout head
        uses: actions/checkout@v6
        with:
          path: head
          fetch-depth: 1

      - name: Filter changed paths
        id: changes
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v3
        with:
          working-directory: head
          filters: |
            buildable:
              - '!**/*.md'

      - name: Skip notice (markdown-only change)
        if: steps.changes.outputs.buildable != 'true'
        run: |
          echo "Only Markdown files changed — skipping startup benchmark." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies (head)
        if: steps.changes.outputs.buildable == 'true'
        uses: ./head/.github/actions/install-dependencies
        with:
          working-directory: head

      - name: Build (head)
        if: steps.changes.outputs.buildable == 'true'
        working-directory: head
        run: pnpm build

      # Only on PRs: also build the base ref so we have something to compare
      # against. On pushes to main there's no base — we just record the
      # absolute number.
      - name: Checkout base ref
        if: github.event_name == 'pull_request' && steps.changes.outputs.buildable == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          fetch-depth: 1

      - name: Install dependencies (base)
        if: github.event_name == 'pull_request' && steps.changes.outputs.buildable == 'true'
        uses: ./head/.github/actions/install-dependencies
        with:
          working-directory: base

      - name: Build (base)
        if: github.event_name == 'pull_request' && steps.changes.outputs.buildable == 'true'
        working-directory: base
        run: pnpm build

      - name: Install hyperfine
        if: steps.changes.outputs.buildable == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y hyperfine

      - name: Run benchmark
        if: steps.changes.outputs.buildable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            hyperfine \
              --warmup 3 \
              --runs 20 \
              --style basic \
              --export-json bench.json \
              --command-name 'PR' 'node head/packages/cli/bin/cf --help' \
              --command-name 'base' 'node base/packages/cli/bin/cf --help'
          else
            hyperfine \
              --warmup 3 \
              --runs 20 \
              --style basic \
              --export-json bench.json \
              --command-name 'main' 'node head/packages/cli/bin/cf --help'
          fi

      - name: Format report
        if: steps.changes.outputs.buildable == 'true'
        run: |
          node head/.github/scripts/bench-report.mjs bench.json | tee report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw hyperfine output
        if: steps.changes.outputs.buildable == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: cli-startup-bench
          path: |
            bench.json
            report.md

      - name: Sticky PR comment
        if: github.event_name == 'pull_request' && steps.changes.outputs.buildable == 'true'
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v2
        with:
          header: cf-startup-bench
          path: report.md
