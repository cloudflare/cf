packages:
  - packages/*
  - fixtures/*

patchedDependencies:
  "@changesets/cli@2.31.0": patches/@changesets__cli@2.31.0.patch
  "@cloudflare/containers-shared@*": patches/@cloudflare__containers-shared@0.21.1.patch
  "@cloudflare/deploy-helpers@*": patches/@cloudflare__deploy-helpers@0.20.1.patch

# Prevent transitive deps from pulling from git / tarball URLs.
# Direct deps (the pinned pkg.pr.new Forge build) are allowed.
blockExoticSubdeps: true

# Allow Cloudflare release batches before pnpm's maturity cutoff. Keep these
# exclusions independent of the current package versions so Dependabot can
# install a newly published batch without editing this list each time.
minimumReleaseAgeExclude:
  - "@cloudflare/*"
  - miniflare
  - workerd
  - wrangler

# pnpm blocks install scripts by default; allowlist what needs them.
allowBuilds:
  "@scarf/scarf": false
  esbuild: true
  msw: false
  # workerd's postinstall places the platform binary miniflare (`--local`)
  # execs. Nothing else in miniflare's tree has an install script.
  workerd: true

gitChecks: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
overrides:
  # Prototype siblings resolve as peers from cf's explicit, reviewed URL pins.
  "@cloudflare/build-output-utils@0.9.6>@cloudflare/config": "-"
  "@cloudflare/config@0.29.0>@cloudflare/workers-utils": "-"
  "@cloudflare/runtime-types@0.1.19>miniflare": "-"
  "@cloudflare/autoconfig@0.8.3>@cloudflare/config": "-"
  "@cloudflare/autoconfig@0.8.3>@cloudflare/workers-utils": "-"
  "@cloudflare/containers-shared@0.23.5>@cloudflare/build-output-utils": "-"
  "@cloudflare/containers-shared@0.23.5>@cloudflare/config": "-"
  "@cloudflare/containers-shared@0.23.5>@cloudflare/workers-utils": "-"
  "@cloudflare/deploy-helpers@0.24.3>@cloudflare/config": "-"
  "@cloudflare/deploy-helpers@0.24.3>@cloudflare/containers-shared": "-"
  "@cloudflare/deploy-helpers@0.24.3>@cloudflare/workers-utils": "-"
  "@cloudflare/deploy-helpers@0.24.3>miniflare": "-"
  "@cloudflare/workers-auth@0.15.3>@cloudflare/workers-utils": "-"
  vite@*: "catalog:"
  vitest@*: 5.0.5
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# pkg.pr.new rewrites sibling dependencies to URLs. Keep blockExoticSubdeps
# enabled: these exact prototype versions consume the explicitly pinned siblings
# as peers instead. Remove these extensions when switching back to npm releases.
packageExtensions:
  "@cloudflare/build-output-utils@0.9.6":
    peerDependencies:
      "@cloudflare/config": "0.29.0"
  "@cloudflare/config@0.29.0":
    peerDependencies:
      "@cloudflare/workers-utils": "0.50.1"
  "@cloudflare/runtime-types@0.1.19":
    peerDependencies:
      "miniflare": "5.20261023.3-beta"
  "@cloudflare/autoconfig@0.8.3":
    peerDependencies:
      "@cloudflare/config": "0.29.0"
      "@cloudflare/workers-utils": "0.50.1"
  "@cloudflare/containers-shared@0.23.5":
    peerDependencies:
      "@cloudflare/build-output-utils": "0.9.6"
      "@cloudflare/config": "0.29.0"
      "@cloudflare/workers-utils": "0.50.1"
  "@cloudflare/deploy-helpers@0.24.3":
    peerDependencies:
      "@cloudflare/config": "0.29.0"
      "@cloudflare/containers-shared": "0.23.5"
      "@cloudflare/workers-utils": "0.50.1"
      "miniflare": "5.20261023.3-beta"
  "@cloudflare/workers-auth@0.15.3":
    peerDependencies:
      "@cloudflare/workers-utils": "0.50.1"
