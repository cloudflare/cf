name: CI

# Four jobs on every PR, merge-queue candidate, and push to main:
#
#   check — `pnpm check` (generation, dependency builds, lint/format + tsgo) over
#           the whole repo.
#   cli   — the cf CLI's in-package vitest suite (packages/cli).
#   wrangler-tests — the canonical Wrangler compatibility corpus retargeted
#                    at cf (packages/wrangler-tests).
#   factory: build the Flue Worker with cf and run its workerd tests.

on:
  pull_request:
  merge_group:
    types: [checks_requested]
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: ${{ github.repository_owner == 'cloudflare' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Test automation scripts
        run: node --test scripts/update-forge.test.ts

      - name: Lint, type-check, and format-check
        run: pnpm check

  cli:
    if: ${{ github.repository_owner == 'cloudflare' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Run cli tests
        run: pnpm --filter cf test

  wrangler-tests:
    if: ${{ github.repository_owner == 'cloudflare' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Run Wrangler compatibility tests
        run: pnpm --filter @cloudflare/wrangler-tests test

  factory:
    if: ${{ github.repository_owner == 'cloudflare' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Build and test Factory Worker
        run: pnpm --filter @cloudflare/factory test
