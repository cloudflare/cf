description: "Generate shell completion integration for Wrangler"
command: "wrangler complete <shell>"
status: "partial"
sourceCommands:
  - "wrangler complete bash"
  - "wrangler complete zsh"
  - "wrangler complete fish"
  - "wrangler complete powershell"
cfReplacementFlow:
  - "cf complete bash"
  - "cf complete zsh"
  - "cf complete fish"
  - "cf complete powershell"
notes:
  - "cf currently uses the same basic complete <shell> shape. Verify PowerShell support in the target cf version before relying on it."
