overlay: 1.1.0
info:
  title: Temporary cf CLI compatibility annotations
  version: 1.0.0
  description: >-
    Remove each action and its cli-compat-guards.ts precondition when the pinned
    Forge OpenAPI supplies the annotation upstream.
actions:
  - target: $["paths"]["/zones/{zone_id}/precursor"]["put"]
    description: Keep the body field mode from taking cf's global --mode flag (cloudflare/cf#28).
    update:
      x-forge-params:
        mode:
          flagName: detection-mode
  - target: $["paths"]["/accounts/{account_id}/cloudforce-one/v2/priority-intelligence/profile"]["put"]
    description: Keep the body field profile from taking cf's global --profile flag (cloudflare/cf#28).
    update:
      x-forge-params:
        profile:
          flagName: organization-profile
  - target: $["paths"]["/accounts/{account_id}/workers/scripts/{script_name}/secrets"]["put"]
    description: Preserve the released workers secrets update <name> positional argument.
    update:
      x-forge-params:
        name:
          positional: true
          required: true
